services:
  go-server:
    build: .
    ports:
      - "${PORT}:${PORT}"
    environment:
      - PORT=${PORT}
    restart: unless-stopped

  hugo:
    image: klakegg/hugo:0.101.0-ext-alpine
    ports:
      - "1313:1313"
    volumes:
      - ./hugo:/src
    working_dir: /src
    command: server --bind 0.0.0.0 --port 1313
    restart: unless-stopped