basePath: /
definitions:
  handlers.AddressResponse:
    properties:
      city_area:
        description: Район города
        example: Северо-восточный административный округ
        type: string
      city_district:
        description: Внутригородской район
        example: район Северное Медведково
        type: string
      country:
        description: Страна
        example: Россия
        type: string
      geo_lat:
        description: Географическая широта
        example: "55.877857"
        type: string
      geo_lon:
        description: Географическая долгота
        example: "37.653672"
        type: string
      house:
        description: Дом
        example: "11"
        type: string
      postal_code:
        description: Почтовый индекс
        example: "127642"
        type: string
      region:
        description: Регион
        example: Москва
        type: string
      result:
        description: Полный адрес
        example: г Москва, ул Сухонская, д 11
        type: string
      source:
        description: Источник данных
        example: dadata
        type: string
      street:
        description: Улица
        example: улица Сухонская
        type: string
    type: object
  handlers.AuthRequest:
    properties:
      password:
        example: password123
        type: string
      username:
        example: user123
        type: string
    type: object
  handlers.AuthResponse:
    properties:
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  handlers.GeocodeRequest:
    properties:
      lat:
        description: Широта
        example: "55.7558"
        type: string
      lng:
        description: Долгота
        example: "37.6173"
        type: string
    type: object
  handlers.LoginResponse:
    properties:
      error:
        example: user not found
        type: string
      success:
        example: true
        type: boolean
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  handlers.SearchRequest:
    properties:
      query:
        description: Строка поиска адреса
        example: москва сухонская 11
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API для работы с адресами и геокодированием
  title: Geo Service API
  version: "1.0"
paths:
  /:
    get:
      description: Возвращает приветственное сообщение
      responses:
        "200":
          description: Добро пожаловать на главную страницу
          schema:
            type: string
      summary: Главная страница
      tags:
      - main
  /api/address/geocode:
    post:
      consumes:
      - application/json
      description: Преобразует широту и долготу в адрес
      parameters:
      - description: Координаты для геокодирования
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.GeocodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Успешный ответ с адресами
          schema:
            items:
              $ref: '#/definitions/handlers.AddressResponse'
            type: array
        "400":
          description: Неверный формат запроса
          schema:
            type: string
        "500":
          description: Внутренняя ошибка сервера
          schema:
            type: string
      summary: Геокодирование координат
      tags:
      - geocode
  /api/address/search:
    post:
      consumes:
      - application/json
      description: Ищет адрес по текстовому запросу
      parameters:
      - description: Поисковый запрос
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.SearchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Успешный ответ с адресами
          schema:
            items:
              $ref: '#/definitions/handlers.AddressResponse'
            type: array
        "400":
          description: Неверный формат запроса
          schema:
            type: string
        "500":
          description: Внутренняя ошибка сервера
          schema:
            type: string
      summary: Поиск адреса
      tags:
      - address
  /api/login:
    post:
      consumes:
      - application/json
      description: Проверяет логин/пароль и возвращает JWT токен
      parameters:
      - description: Данные для входа
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.AuthRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Успешный вход или ошибка аутентификации
          schema:
            $ref: '#/definitions/handlers.LoginResponse'
        "400":
          description: Неверный запрос
          schema:
            type: string
        "405":
          description: Метод не разрешен
          schema:
            type: string
        "500":
          description: Ошибка сервера
          schema:
            type: string
      summary: Аутентификация пользователя
      tags:
      - auth
  /api/register:
    post:
      consumes:
      - application/json
      description: Создает аккаунт пользователя и возвращает JWT токен
      parameters:
      - description: Данные для регистрации
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.AuthRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Успешная регистрация
          schema:
            $ref: '#/definitions/handlers.AuthResponse'
        "400":
          description: Неверный запрос
          schema:
            type: string
        "500":
          description: Ошибка сервера
          schema:
            type: string
      summary: Регистрация нового пользователя
      tags:
      - auth
swagger: "2.0"
