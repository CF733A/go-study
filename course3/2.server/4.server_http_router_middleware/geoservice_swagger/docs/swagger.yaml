definitions:
  main.AddressResponse:
    properties:
      city_area:
        description: Район города
        example: Северо-восточный административный округ
        type: string
      city_district:
        description: Внутригородской район
        example: район Северное Медведково
        type: string
      country:
        description: Страна
        example: Россия
        type: string
      geo_lat:
        description: Географическая широта
        example: "55.877857"
        type: string
      geo_lon:
        description: Географическая долгота
        example: "37.653672"
        type: string
      house:
        description: Дом
        example: "11"
        type: string
      postal_code:
        description: Почтовый индекс
        example: "127642"
        type: string
      region:
        description: Регион
        example: Москва
        type: string
      result:
        description: Полный адрес
        example: г Москва, ул Сухонская, д 11
        type: string
      source:
        description: Источник данных
        example: dadata
        type: string
      street:
        description: Улица
        example: улица Сухонская
        type: string
    type: object
  main.GeocodeRequest:
    properties:
      lat:
        description: Широта
        example: "55.7558"
        type: string
      lng:
        description: Долгота
        example: "37.6173"
        type: string
    type: object
  main.SearchRequest:
    properties:
      query:
        description: Строка поиска адреса
        example: москва сухонская 11
        type: string
    type: object
info:
  contact: {}
  description: Микросервис для поиска и геокодирования адресов через DaData.
  title: Геосервис API
  version: "1.0"
paths:
  /api/address/geocode:
    post:
      consumes:
      - application/json
      description: Получение адреса по географическим координатам (широте и долготе)
        с использованием DaData.
      parameters:
      - description: Географические координаты
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.GeocodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Успешный ответ
          schema:
            items:
              $ref: '#/definitions/main.AddressResponse'
            type: array
        "400":
          description: Неверный запрос
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Обратное геокодирование
      tags:
      - geocode
  /api/address/search:
    post:
      consumes:
      - application/json
      description: Поиск адресов по строке запроса с использованием DaData.
      parameters:
      - description: Поисковый запрос
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.SearchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Успешный ответ
          schema:
            items:
              $ref: '#/definitions/main.AddressResponse'
            type: array
        "400":
          description: Неверный запрос
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Поиск адреса
      tags:
      - addresses
swagger: "2.0"
